<text x="760" y="184" text-anchor="end" font-family="Fira Code, monospace" font-size="16" fill="#dddddd">9.7%</text>
<rect x="40" y="194" width="720" height="6" rx="3" fill="#333333"/>
<rect x="40" y="194" width="69.59" height="6" rx="3" fill="#796699"/>
