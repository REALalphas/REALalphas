<text x="760" y="232" text-anchor="end" font-family="Fira Code, monospace" font-size="16" fill="#dddddd">6.9%</text>
<rect x="40" y="242" width="720" height="6" rx="3" fill="#333333"/>
<rect x="40" y="242" width="49.97" height="6" rx="3" fill="#796699"/>
<text x="40" y="280" font-size="18">CSS</text>
<text x="760" y="280" text-anchor="end" font-family="Fira Code, monospace" font-size="16" fill="#dddddd">5.0%</text>
<rect x="40" y="290" width="720" height="6" rx="3" fill="#333333"/>
<rect x="40" y="290" width="35.71" height="6" rx="3" fill="#796699"/>
