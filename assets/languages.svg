<text x="40" y="88" font-size="18">JavaScript</text>
<text x="760" y="88" text-anchor="end" font-family="Fira Code, monospace" font-size="16" fill="#dddddd">65.3%</text>
<rect x="40" y="98" width="720" height="6" rx="3" fill="#333333"/>
<rect x="40" y="98" width="469.97" height="6" rx="3" fill="#796699"/>
<text x="40" y="136" font-size="18">TypeScript</text>
<text x="760" y="136" text-anchor="end" font-family="Fira Code, monospace" font-size="16" fill="#dddddd">13.2%</text>
<rect x="40" y="146" width="720" height="6" rx="3" fill="#333333"/>
<rect x="40" y="146" width="94.76" height="6" rx="3" fill="#796699"/>
