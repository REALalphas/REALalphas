name: Languages

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - scripts/languages.py
      - .github/workflows/languages.yml

permissions:
  contents: write

concurrency:
  group: profile-languages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate language card
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python scripts/languages.py
      - name: Commit updated card
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/languages.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update language statistics"
            git push
          fi
