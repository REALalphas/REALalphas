name: Profile widgets

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main, master, feat/profile-activity-widgets]
    paths:
      - scripts/languages.py
      - scripts/activity.py
      - scripts/profile.py
      - scripts/svg_geometry.py
      - assets/logo.svg
      - assets/fonts/**
      - .github/workflows/languages.yml

permissions:
  contents: write

concurrency:
  group: profile-languages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate profile header
        run: python scripts/profile.py
      - name: Restore follower state
        uses: actions/cache/restore@v5
        with:
          path: .cache/profile/activity-state.json
          key: profile-followers-v1-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            profile-followers-v1-${{ github.ref }}-
      - name: Generate language card
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python scripts/languages.py
      - name: Generate activity widgets
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python scripts/activity.py
      - name: Save follower state
        uses: actions/cache/save@v5
        with:
          path: .cache/profile/activity-state.json
          key: profile-followers-v1-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit updated card
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/profile.svg assets/languages.svg assets/activity.svg
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            git commit -m "Update profile widgets"
            git push
          else
            echo 'All generated files are up to date; no commit needed.'
          fi
