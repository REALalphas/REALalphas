:root{color-scheme:dark;font-family:Manrope,system-ui,sans-serif;color:var(--foreground,#fff)}
*{box-sizing:border-box}body{margin:0;display:grid;gap:24px;font-family:var(--font-sans,system-ui,sans-serif);color:var(--foreground,#fff)}
h1{font-size:24px;font-weight:500;margin:0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.preview{min-height:360px;overflow:auto;background:var(--card,#222);border-radius:20px;padding:40px;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px #9994}
.tile{position:relative;overflow:hidden;border-radius:16px;min-width:180px;min-height:120px;padding:24px 20px;background:#3178c6;box-shadow:inset 0 0 0 1.5px #9994;resize:both;overflow:hidden;flex-shrink:0}
.tile:before{content:"";position:absolute;inset:0;background:radial-gradient(circle var(--gradient-radius) at var(--gx) var(--gy),rgb(var(--rgb) / .75),rgb(var(--rgb) / .07));pointer-events:none}
.name,.number{position:relative;z-index:1}.name{font-size:24px;font-weight:500;color:#fff9}.number{position:absolute;right:20px;bottom:14px;font-family:Pliant,sans-serif;font-size:var(--size);font-weight:var(--weight);font-stretch:calc(var(--stretch) * 1%);font-variation-settings:"wdth" var(--stretch),"wght" var(--weight);color:#fff9;line-height:1}
.controls{display:grid;gap:14px;background:var(--card,#222);border-radius:16px;padding:20px;box-shadow:inset 0 0 0 1.5px #9994}.control{display:grid;gap:6px}.row{display:flex;justify-content:space-between;gap:12px;color:#ddd;font-size:14px}.row output{font-variant-numeric:tabular-nums;color:#999}.control input[type=range]{width:100%;accent-color:#796699}.swatches{display:flex;gap:8px}.swatches button{width:28px;height:28px;border:0;border-radius:8px;cursor:pointer;box-shadow:inset 0 0 0 1.5px #9994}.hint{font-size:13px;color:#999;line-height:1.4;margin:0}
@media(max-width:760px){body{padding:0}.layout{grid-template-columns:1fr}.preview{min-height:360px;padding:20px}}
</style>
</head>

</section></div>
<script>
const tile=document.querySelector('#tile'),number=document.querySelector('#number'),name=document.querySelector('#name');
const ids=['width','height','size','weight','stretch','opacity','gx','gy','radius'];
function update(){const v=Object.fromEntries(ids.map(id=>[id,document.querySelector('#'+id).value]));tile.style.width=v.width+'px';tile.style.height=v.height+'px';tile.style.setProperty('--size',v.size+'px');tile.style.setProperty('--weight',v.weight);tile.style.setProperty('--stretch',v.stretch);tile.style.setProperty('--gx',v.gx+'%');tile.style.setProperty('--gy',v.gy+'%');tile.style.setProperty('--gradient-radius',v.radius+'px');number.style.opacity=v.opacity;name.textContent=document.querySelector('#label').value;number.textContent=document.querySelector('#value').value;ids.forEach(id=>document.querySelector('#'+id+'Out').textContent=document.querySelector('#'+id).value+(['width','height','size','radius'].includes(id)?'px':['gx','gy','stretch'].includes(id)?'%':''));document.querySelector('#opacityOut').textContent=v.opacity;document.querySelector('#nameOut').textContent=name.textContent;document.querySelector('#valueOut').textContent=number.textContent;document.querySelector('#css').textContent=`width:${v.width}px; height:${v.height}px;\nfont-size:${v.size}px; font-weight:${v.weight}; font-stretch:${v.stretch}%;\nfont-variation-settings:"wdth" ${v.stretch}, "wght" ${v.weight};`}
ids.forEach(id=>document.querySelector('#'+id).addEventListener('input',update));['label','value'].forEach(id=>document.querySelector('#'+id).addEventListener('input',update));document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{tile.style.setProperty('--color',b.dataset.color);tile.style.setProperty('--rgb',b.dataset.color.match(/[a-f0-9]{2}/gi).map(c=>parseInt(c,16)).join(' '));update()});tile.style.setProperty('--color','#3178c6');tile.style.setProperty('--rgb','49 120 198');tile.style.background='#222';update();
const resizeObserver=new ResizeObserver(()=>{
const w=Math.round(tile.getBoundingClientRect().width),h=Math.round(tile.getBoundingClientRect().height);
for(const [key,value] of [['width',w],['height',h]]){document.querySelector('#'+key).value=value;document.querySelector('#'+key+'Out').textContent=value+'px'}
});resizeObserver.observe(tile);
</script>
</body></html>
