<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Language tile playground</title>
<style>
@font-face{font-family:Pliant;src:url('assets/fonts/Pliant-digits.woff') format('woff');font-weight:200 600;font-stretch:100% 125%}
:root{color-scheme:dark;font-family:Manrope,system-ui,sans-serif;background:#191919;color:#fff}
*{box-sizing:border-box}body{margin:0;padding:24px;display:grid;gap:24px;max-width:1100px;margin-inline:auto}
h1{font-size:24px;font-weight:500;margin:0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.preview{min-height:520px;background:#222;border-radius:20px;padding:40px;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px #9994}
.tile{position:relative;overflow:hidden;border-radius:16px;min-width:180px;min-height:120px;padding:24px 20px;background:#3178c6;box-shadow:inset 0 0 0 1.5px #9994;transition:width .12s,height .12s}
.tile:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--gx) var(--gy),color-mix(in srgb,var(--color) 70%,white 30% / .75),color-mix(in srgb,var(--color) 40%,transparent));pointer-events:none}
.name,.number{position:relative;z-index:1}.name{font-size:24px;font-weight:500;color:#fff9}.number{position:absolute;right:20px;bottom:14px;font-family:Pliant,Manrope,sans-serif;font-size:var(--size);font-weight:var(--weight);font-stretch:var(--stretch);font-variation-settings:"wdth" var(--stretch),"wght" var(--weight);color:#fff9;line-height:1}
.controls{display:grid;gap:14px;background:#222;border-radius:16px;padding:20px;box-shadow:inset 0 0 0 1.5px #9994}.control{display:grid;gap:6px}.row{display:flex;justify-content:space-between;gap:12px;color:#ddd;font-size:14px}.row output{font-variant-numeric:tabular-nums;color:#999}.control input[type=range]{width:100%;accent-color:#796699}.swatches{display:flex;gap:8px}.swatches button{width:28px;height:28px;border:0;border-radius:8px;cursor:pointer;box-shadow:inset 0 0 0 1.5px #9994}.hint{font-size:13px;color:#999;line-height:1.4;margin:0}
@media(max-width:760px){body{padding:14px}.layout{grid-template-columns:1fr}.preview{min-height:360px;padding:20px}}
</style>
</head>
<body>
<h1>Language tile playground</h1>
<div class="layout">
<section class="preview"><div class="tile" id="tile"><span class="name" id="name">TypeScript</span><span class="number" id="number">25</span></div></section>
<section class="controls">
<label class="control"><span class="row"><span>Width</span><output id="widthOut"></output></span><input id="width" type="range" min="180" max="720" value="354"></label>
<label class="control"><span class="row"><span>Height</span><output id="heightOut"></output></span><input id="height" type="range" min="120" max="400" value="171"></label>
<label class="control"><span class="row"><span>Font size</span><output id="sizeOut"></output></span><input id="size" type="range" min="24" max="180" value="64"></label>
<label class="control"><span class="row"><span>Font weight</span><output id="weightOut"></output></span><input id="weight" type="range" min="200" max="600" step="1" value="600"></label>
<label class="control"><span class="row"><span>Font width (wdth)</span><output id="stretchOut"></output></span><input id="stretch" type="range" min="100" max="125" step="1" value="125"></label>
<label class="control"><span class="row"><span>Number opacity</span><output id="opacityOut"></output></span><input id="opacity" type="range" min="0.1" max="1" step="0.01" value="0.6"></label>
<label class="control"><span class="row"><span>Gradient X</span><output id="gxOut"></output></span><input id="gx" type="range" min="-100" max="200" value="150"></label>
<label class="control"><span class="row"><span>Gradient Y</span><output id="gyOut"></output></span><input id="gy" type="range" min="-100" max="200" value="-50"></label>
<label class="control"><span class="row"><span>Language</span><output id="nameOut"></output></span><input id="label" type="text" value="TypeScript"></label>
<label class="control"><span class="row"><span>Value</span><output id="valueOut"></output></span><input id="value" type="text" value="25"></label>
<div class="control"><span class="row"><span>Language color</span></span><div class="swatches"><button data-color="#3178c6" style="background:#3178c6"></button><button data-color="#f1e05a" style="background:#f1e05a"></button><button data-color="#dea584" style="background:#dea584"></button><button data-color="#663399" style="background:#663399"></button><button data-color="#999999" style="background:#999999"></button></div></div>
<p class="hint">Change any setting; the tile updates immediately. The generated CSS is shown below.</p>
<pre id="css" style="white-space:pre-wrap;color:#bbb;margin:0;font-size:12px"></pre>
</section></div>
<script>
const tile=document.querySelector('#tile'),number=document.querySelector('#number'),name=document.querySelector('#name');
const ids=['width','height','size','weight','stretch','opacity','gx','gy'];
function update(){const v=Object.fromEntries(ids.map(id=>[id,document.querySelector('#'+id).value]));tile.style.width=v.width+'px';tile.style.height=v.height+'px';tile.style.setProperty('--size',v.size+'px');tile.style.setProperty('--weight',v.weight);tile.style.setProperty('--stretch',v.stretch);tile.style.setProperty('--gx',v.gx+'%');tile.style.setProperty('--gy',v.gy+'%');number.style.opacity=v.opacity;name.textContent=document.querySelector('#label').value;number.textContent=document.querySelector('#value').value;ids.forEach(id=>document.querySelector('#'+id+'Out').textContent=document.querySelector('#'+id).value+(id==='opacity'?'':'px'));document.querySelector('#opacityOut').textContent=v.opacity;document.querySelector('#nameOut').textContent=name.textContent;document.querySelector('#valueOut').textContent=number.textContent;document.querySelector('#css').textContent=`width:${v.width}px; height:${v.height}px;\nfont-size:${v.size}px; font-weight:${v.weight}; font-stretch:${v.stretch}%;\nfont-variation-settings:"wdth" ${v.stretch}, "wght" ${v.weight};`}
ids.forEach(id=>document.querySelector('#'+id).addEventListener('input',update));['label','value'].forEach(id=>document.querySelector('#'+id).addEventListener('input',update));document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{tile.style.setProperty('--color',b.dataset.color);tile.style.background=b.dataset.color;update()});tile.style.setProperty('--color','#3178c6');update();
</script>
</body></html>
